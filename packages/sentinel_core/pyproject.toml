[project]
name = "sentinel-core"
version = "0.2.0"
description = "Sentinel platform core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9", "pydantic-settings>=2.6", "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30",
  "alembic>=1.14", "cryptography>=43", "pyjwt[crypto]>=2.9", "httpx>=0.27", "structlog>=24.4",
  "jsonschema>=4.23", "aiokafka>=0.12", "fastapi>=0.115",
]

[project.scripts]
sentinel-admin = "sentinel_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_core"]
