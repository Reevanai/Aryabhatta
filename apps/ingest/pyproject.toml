[project]
name = "sentinel-ingest"
version = "0.2.0"
description = "Sentinel ingest worker"
requires-python = ">=3.12,<3.13"
dependencies = ["sentinel-core", "sentinel-ingestion"]

[project.scripts]
sentinel-ingest = "sentinel_ingest.main:main"

[tool.uv.sources]
sentinel-core = { workspace = true }
sentinel-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_ingest"]
