name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.4"
          enable-cache: true
      - run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Module boundaries
        run: uv run lint-imports
      - name: Licence allow-list
        run: uv run python scripts/check_licences.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.4"
          enable-cache: true
      - run: uv sync --frozen
      - name: Start PostgreSQL, Redpanda and OpenBao
        run: make deps-up
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/dev.env logs --tail 200

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -f deploy/compose/Dockerfile -t sentinel-app:ci .
