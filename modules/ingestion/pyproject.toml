[project]
name = "sentinel-ingestion"
version = "0.2.0"
description = "Sentinel ingestion module"
requires-python = ">=3.12,<3.13"
dependencies = ["sentinel-core", "python-multipart>=0.0.12"]

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_ingestion"]
