[project]
name = "sentinel-txn-fraud"
version = "0.4.0"
description = "Sentinel transaction fraud module: rules, features, scoring"
requires-python = ">=3.12,<3.13"
dependencies = ["sentinel-core", "sentinel-ingestion", "valkey>=6.0"]

[tool.uv.sources]
sentinel-core = { workspace = true }
sentinel-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_txn_fraud"]
